name: Debian

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  deb:
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - name: Instalar dependencias
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            python3 \
            python3-pyqt6 \
            python3-serial \
            libgl1 \
            libglib2.0-0 \
            libegl1 \
            libxkbcommon0 \
            libdbus-1-3 \
            libfontconfig1 \
            libx11-6 \
            dpkg-dev
      - uses: actions/checkout@v4
      - name: Probar
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 -m unittest discover -s tests -v
      - name: Empaquetar
        run: bash debian/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ConfiguradorE95-debian
          path: |
            dist/*.deb
            LICENSE
